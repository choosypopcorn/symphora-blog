version: '3.8'

services:
  app:
    build: .
    container_name: symphora-blog-app
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - nginx
    environment:
      - DATABASE_URL=sqlite:///var/www/html/var/data/blog.db

  nginx:
    image: nginx:alpine
    container_name: symphora-blog-nginx
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - app

volumes:
  db_data: