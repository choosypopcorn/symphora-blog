security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'bcrypt'
    providers:
        app_user_provider:
            memory:
                users:
                    admin:
                        password: '$2y$10$hashed_password_here' # Replace with actual hash from storage.php
                        roles: ['ROLE_ADMIN']
    
    firewalls:
        api:
            pattern: ^/api
            stateless: true
            http_basic: true
            provider: app_user_provider

        main:
            stateless: true

            form_login:
                provider: app_user_provider
                login_path: app_login
                check_path: app_login
                csrf_token_id: security.csrf.token_manager

            logout:
                path: app_logout
                invalidate_session: true

    access_control:
        - { path: ^/admin, roles: ROLE_ADMIN }
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }
